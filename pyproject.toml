[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "StarVEP_eeg_functions"
version = "0.0.1"
description = "Useful functions to load, preprocess and use StarVEP data"
requires-python = ">=3.10"
dependencies = [
    "gromo",
    "torch",
    "torchvision",
    "numpy",
    "tqdm",
    "pyyaml",
    "scikit-learn",
    "wandb>=0.17",
    "mne>=1.11.0",
    "pyriemann>=0.10",
    "imbalanced-learn>=0.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["Alignment", "."]

[tool.pytest.ini_options]
markers = [
    "integration: tests that need optional CLIs or long-running services",
]

[tool.isort]
profile = "black"
line_length = 90


